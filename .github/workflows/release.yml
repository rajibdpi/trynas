name: GitHub release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, e.g. v1.0.0
        required: true
        type: string
      publish:
        description: Publish the release after validation (otherwise keep it a draft)
        default: false
        type: boolean

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate administrator password secret
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          password = os.environ.get("ADMIN_PASSWORD", "")
          if not password:
              print("::error::Missing repository Actions secret ADMIN_PASSWORD. Add it under Settings > Secrets and variables > Actions > New repository secret, then rerun all jobs.")
              raise SystemExit(1)
          if not 8 <= len(password.encode("utf-8")) <= 72 or password in ("change-this-now", "replace-with-a-strong-random-password"):
              print("::error::ADMIN_PASSWORD must contain 8–72 UTF-8 bytes and must not use a placeholder password. Update the repository Actions secret, then rerun all jobs.")
              raise SystemExit(1)
          PY
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - name: Validate release tag
        if: github.ref != 'refs/heads/main' || github.event_name != 'push'
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo 'Use a version tag such as v1.0.0 or v1.0.0-rc.1.' >&2
            exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@10
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Check frontend types
        working-directory: frontend
        run: pnpm exec tsc --noEmit
      - name: Test release tag selection
        run: python3 -m unittest discover -s scripts -p release_tag_test.py
      - name: Test and vet backend
        run: |
          go test ./...
          go vet ./...
      - name: Build all six release binaries
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: go run ./scripts/build --all --admin-password-env
      - name: Verify release checksums and include installation files
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          cp get.sh get.ps1 installation.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/trynas-linux-amd64
            dist/trynas-linux-arm64
            dist/trynas-windows-amd64.exe
            dist/trynas-windows-arm64.exe
            dist/trynas-darwin-amd64
            dist/trynas-darwin-arm64
            dist/SHA256SUMS
            dist/get.sh
            dist/get.ps1
            dist/installation.md

  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test native and shell installers
        run: go test -count=1 -v ./scripts/install

  release:
    needs: [build, installers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - name: Select and reserve incremental release tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release_tag.py
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Create or update draft and optionally publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish) || false }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo 'Invalid version tag.' >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<'NOTES'
          Standalone TryNAS builds for Linux, macOS, and Windows on AMD64 and ARM64.

          Download the matching binary and verify its hash against SHA256SUMS.
          get.sh and get.ps1 provide checksum-verified installation. See installation.md.

          Fresh installations use a shared build-time administrator password. Set ADMIN_PASSWORD at runtime to override it.
          Initial credentials print in the terminal when a fresh database is initialized.
          Stop the previous instance before upgrading and keep your configuration and database.
          NOTES
          state="$RUNNER_TEMP/release-state"
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$state"; then
            if [[ "$(cat "$state")" != true ]]; then
              echo 'This release is already public; leaving its assets unchanged.'
              exit 0
            fi
          else
            flags=()
            if [[ "$RELEASE_TAG" == v*-* ]]; then flags+=(--prerelease); fi
            if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
              flags+=(--target "$GITHUB_SHA")
            else
              flags+=(--verify-tag)
            fi
            gh release create "$RELEASE_TAG" --draft --title "TryNAS $RELEASE_TAG" --notes-file "$notes" "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          if [[ "$PUBLISH" == true ]]; then
            flags=()
            if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then flags+=(--latest); fi
            gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
          fi
