name: GitHub release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, e.g. v1.0.0
        required: true
        type: string
      publish:
        description: Publish the release after validation (otherwise keep it a draft)
        default: false
        type: boolean

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - name: Validate release tag
        if: github.ref != 'refs/heads/main' || github.event_name != 'push'
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo 'Use a version tag such as v1.0.0 or v1.0.0-rc.1.' >&2
            exit 1
          fi
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@12.5.1
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build embedded frontend and check types
        working-directory: frontend
        env:
          TRYNAS_EMBEDDED_BUILD: 'true'
          NEXT_PUBLIC_EMBEDDED: 'true'
          NEXT_PUBLIC_API_URL: ''
        run: pnpm build
      - name: Test release tag selection
        run: python3 -m unittest discover -s scripts -p release_tag_test.py
      - name: Test and vet backend
        run: |
          go test ./...
          go vet ./...
      - name: Audit Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Audit frontend dependencies
        working-directory: frontend
        run: pnpm security:check
      - name: Select build version and reserve incremental release tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            python3 scripts/release_tag.py
          else
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Build all six release binaries
        run: go run ./scripts/build --all --skip-frontend
      - name: Verify release checksums and include installation files
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          cp get.sh get.ps1 installation.md dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/trynas-linux-amd64
            dist/trynas-linux-arm64
            dist/trynas-windows-amd64.exe
            dist/trynas-windows-arm64.exe
            dist/trynas-darwin-amd64
            dist/trynas-darwin-arm64
            dist/SHA256SUMS
            dist/VERSION
            dist/get.sh
            dist/get.ps1
            dist/installation.md

  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test native and shell installers
        run: go test -count=1 -v ./scripts/install

  release:
    needs: [build, installers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Create or update draft and optionally publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish) || false }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo 'Invalid version tag.' >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          download_url="https://github.com/$GH_REPO/releases/download/$RELEASE_TAG"
          cat > "$notes" <<NOTES
          Standalone TryNAS builds for Linux, macOS, and Windows on AMD64 and ARM64.

          Download the matching binary and verify its hash against [SHA256SUMS]($download_url/SHA256SUMS).
          [get.sh]($download_url/get.sh) and [get.ps1]($download_url/get.ps1) provide checksum-verified installation. See the [installation guide]($download_url/installation.md).

          Fresh installations require a unique runtime ADMIN_PASSWORD. Release binaries contain no administrator credentials.
          Initial credentials print in the terminal when a fresh database is initialized.
          Stop the previous instance before upgrading and keep your configuration and database.

          | Architecture | Windows | macOS | Linux |
          | --- | --- | --- | --- |
          | x64 (AMD64) | [exe]($download_url/trynas-windows-amd64.exe) | [binary]($download_url/trynas-darwin-amd64) | [binary]($download_url/trynas-linux-amd64) |
          | ARM64 | [exe]($download_url/trynas-windows-arm64.exe) | [binary]($download_url/trynas-darwin-arm64) | [binary]($download_url/trynas-linux-arm64) |
          NOTES
          state="$RUNNER_TEMP/release-state"
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$state"; then
            if [[ "$(cat "$state")" != true ]]; then
              echo 'This release is already public; leaving its assets unchanged.'
              exit 0
            fi
          else
            flags=()
            if [[ "$RELEASE_TAG" == v*-* ]]; then flags+=(--prerelease); fi
            if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
              flags+=(--target "$GITHUB_SHA")
            else
              flags+=(--verify-tag)
            fi
            gh release create "$RELEASE_TAG" --draft --title "TryNAS $RELEASE_TAG" --notes-file "$notes" "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --notes-file "$notes"
          if [[ "$PUBLISH" == true ]]; then
            flags=()
            if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then flags+=(--latest); fi
            gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
          fi
